name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Release Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite with branch coverage gate
        run: uv run pytest --cov=xeno_canto_mcp --cov-branch --cov-report=term-missing

      - name: Build package distribution
        run: uv build

      - name: Verify package distribution
        run: uv run python scripts/check_dist.py

      - name: Run stdio smoke test
        run: uv run --no-project --with ./dist/xeno_canto_mcp-0.1.0-py3-none-any.whl python scripts/smoke.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
