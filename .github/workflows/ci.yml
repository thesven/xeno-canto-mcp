name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Gate (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Verify dependency lockfile
        run: uv sync --locked

      - name: Code style check (ruff format)
        run: uv run ruff format --check src tests scripts

      - name: Lint check (ruff)
        run: uv run ruff check src tests scripts

      - name: Run test suite with branch coverage (>90% floor)
        run: uv run pytest --cov=xeno_canto_mcp --cov-branch --cov-report=term-missing

      - name: Build package distribution (wheel and sdist)
        run: uv build

      - name: Verify distribution membership
        run: uv run python scripts/check_dist.py

      - name: Run stdio smoke test against installed wheel
        run: uv run --no-project --with ./dist/xeno_canto_mcp-0.1.0-py3-none-any.whl python scripts/smoke.py
